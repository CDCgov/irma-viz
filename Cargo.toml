[package]
name = "irma-viz"
version = "0.2.0-dev"
edition = "2024"

[features]
default = []
demo = []

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"
clap = { version = "4", default-features = false, features = ["derive", "help", "std", "usage", "error-context"] }
anyhow = "1"
csv = "1"
kuva = { version = "0.2", features = ["pdf"] }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
strip = true

[profile.prod]
inherits = "release"
codegen-units = 1
lto = "fat"
