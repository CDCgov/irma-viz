[package]
name = "irma-viz"
version = "0.2.0-dev"
edition = "2024"

[features]
default = []
demo = ["pdf"]
pdf = ["kuva/pdf"]


[dependencies]
kuva = { version = "0.5", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
clap = { version = "4", default-features = false, features = [
    "derive",
    "help",
    "std",
    "usage",
    "error-context",
] }
csv = "1"
jiff = "0.2"

[profile.dev]
opt-level = 1


[profile.prod]
opt-level = "z"
panic = "abort"
strip = true
inherits = "release"
codegen-units = 1
lto = "fat"
