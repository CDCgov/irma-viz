r="start">-<tspan font-weight="bold"> OTHER</tspan> : non-flu and contaminant/poor flu signal.</text><text x="61.300000000000004" y="170.8" font-size="14" text-anchor="start" font-weight="bold">2. Percentages of all read patterns passing QC</text><text x="61.300000000000004" y="192.5" font-size="14" text-anchor="start" font-weight="bold">process</text><text x="61.300000000000004" y="218.54" font-size="12" text-anchor="start">- Patterns are clustered or non-redundant reads.</text><text x="61.300000000000004" y="237.14000000000001" font-size="12" text-anchor="start">-<tspan font-weight="bold"> ASSEMBLED</tspan> : excellent influenza read patterns.</text><text x="61.300000000000004" y="255.74" font-size="12" text-anchor="start">-<tspan font-weight="bold"> UNUSABLE</tspan> : poor or contaminant flu patterns.</text><text x="61.300000000000004" y="274.34000000000003" font-size="12" text-anchor="start">-<tspan font-weight="bold"> CHIMERIC</tspan> : flu patterns matching both strands.</text><text x="61.300000000000004" y="292.94" font-size="12" text-anchor="start">-<tspan font-weight="bold"> NO MATCH</tspan> : non-flu read patterns.</text><text x="61.300000000000004" y="320.84000000000003" font-size="14" text-anchor="start" font-weight="bold">3. Percentages of assembled, merged-pair read</text><text x="61.300000000000004" y="342.54" font-size="14" text-anchor="start" font-weight="bold">counts</text><text x="61.300000000000004" y="368.58" font-size="12" text-anchor="start">- Shows the proportion of gene segments to the genome.</text><text x="61.300000000000004" y="387.18" font-size="12" text-anchor="start">- Paired-end reads have been merged into a single count</text><text x="61.300000000000004" y="405.78000000000003" font-size="12" text-anchor="start">unless not applicable: single-end reads have been used.</text></g></svg>