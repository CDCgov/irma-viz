read patterns.</text><text x="59" y="280.54" font-size="14" text-anchor="start" font-weight="bold">3. Percentages of assembled, merged-pair read counts</text><text x="59" y="306.58" font-size="12" text-anchor="start">- Shows the proportion of gene segments to the genome.</text><text x="59" y="325.18" font-size="12" text-anchor="start">- Paired-end reads have been merged into a single count</text><text x="59" y="343.78000000000003" font-size="12" text-anchor="start">unless not applicable: single-end reads have been used.</text></g></svg>